spring:
  application:
    name: queueify-campaign-service

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  datasource:
    url: jdbc:mysql://localhost:3306/queueify
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: teamqueueify@gmail.com
    password:
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Socket Timeouts to Prevent Thread Blockage
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          # Localhost override to prevent EHLO handshake delays
          localhost: localhost

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: 5367566859703373367639792F423F452848284D6251655468576D5A71347437
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

queueify:
  processor-start:
    enabled: ${CAMPAIGN_START_BRIDGE_ENABLED:false}
    topic: ${KAFKA_START_TOPIC:campaign-start-topic}
    poll-ms: 2000
  aws:
    s3:
      bucket: ${QUEUEIFY_S3_BUCKET:queueify-campaign-assets-local}
      region: ${AWS_REGION:ap-southeast-2}
      base-prefix: ${QUEUEIFY_S3_BASE_PREFIX:campaign-assets}
